name: Ice Forest task
on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Open ai-ready issue number'
        required: true
        type: string
permissions:
  contents: read
  issues: write
concurrency:
  group: ice-forest-dispatch
  cancel-in-progress: false
jobs:
  dispatch:
    # Evaluated before runner allocation. No paid private runner fallback.
    if: github.event.repository.private == false && vars.AUTOMATION_ENABLED == 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: node automation/dispatch.mjs
        env:
          AUTOMATION_ENABLED: ${{ vars.AUTOMATION_ENABLED }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          GITHUB_TOKEN: ${{ github.token }}
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
